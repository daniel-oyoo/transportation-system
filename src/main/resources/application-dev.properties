spring.datasource.url=${DEV_DATABASE_URL:jdbc:h2:file:./data/easycoach-dev;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DEV_DATABASE_USERNAME:sa}
spring.datasource.password=${DEV_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
logging.level.com.daniel=INFO
